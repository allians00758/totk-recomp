name: Отчёт о проблеме
description: Сборка, запуск или игра остановились, упали или работают неправильно.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Никогда не прикладывайте файлы игры, ключи, прошивку, сгенерированный код, `swgame.so` или сохранения**
        и не давайте ссылок на копии игры: такие issue удаляются.
  - type: input
    id: commit
    attributes:
      label: Коммит
      description: "`git log --oneline -1` в папке проекта."
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Шаг
      description: Где остановилось (docs/TOTK.md).
      options:
        - "2. Перевод кода в C (gen.py)"
        - "3. Компиляция"
        - "4. Рантайм / swgame.so / romfs.bin"
        - "5. Запуск"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Система
      description: SteamOS или дистрибутив, GPU и драйвер, CPU.
      placeholder: Steam Deck, SteamOS 3.8, RADV
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог
      description: Весь вывод (`2>&1 | tee run.log`) — перетащите файл сюда.
    validations:
      required: true
